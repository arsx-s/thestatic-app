# The Static — Admin Dashboard
# Deployed on Netlify as a separate site from the same monorepo
# Base directory: apps/admin (configured in Netlify UI)

[build]
  command = "pnpm run build"
  publish = ".next"
  function_directory = ".netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Next.js runtime
[build.runtime]
  selected = "nodejs"
  version = "20"

# ============================================================
# Next.js static assets headers
# ============================================================

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# Auth callback redirect
# ============================================================

[[redirects]]
  from = "/auth/callback"
  to = "/auth/callback"
  status = 200

# ============================================================
# Environment variables (set in Netlify UI):
#   NEXT_PUBLIC_SUPABASE_URL   — public (frontend)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — public (frontend)
#   SUPABASE_SERVICE_ROLE_KEY  — SECRET (server-side only, admin dashboard)
# ============================================================
