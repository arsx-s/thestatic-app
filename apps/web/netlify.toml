# The Static — PWA (Member-Facing)
# Deployed on Netlify as a separate site from the same monorepo
# Base directory: apps/web (configured in Netlify UI)

[build]
  command = "pnpm run build"
  publish = ".next"
  function_directory = ".netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Next.js runtime
[build.runtime]
  selected = "nodejs"
  version = "20"

# ============================================================
# PWA Service Worker headers — critical for iOS Safari installation
# The service worker must be served from /sw with Service-Worker-Allowed: /
# ============================================================

[[headers]]
  for = "/sw"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript"

# ============================================================
# Web App Manifest headers
# ============================================================

[[headers]]
  for = "/manifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# Icon headers — long cache for static assets
# ============================================================

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# Next.js static assets headers
# ============================================================

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# Redirects
# ============================================================

# Supabase Auth callback — handled by Next.js route
[[redirects]]
  from = "/auth/callback"
  to = "/auth/callback"
  status = 200

# Ensure /sw is always served dynamically (not cached as static file)
[[redirects]]
  from = "/sw"
  to = "/sw"
  status = 200
  conditions = {Method = ["GET"]}

# ============================================================
# Environment variables (set in Netlify UI, not here):
#   NEXT_PUBLIC_SUPABASE_URL   — public
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — public
# ============================================================
